[package]
name = "example-wordle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
axum-live-view = { path = "../../axum-live-view", version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["fs"] }
